<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Receptionist Demo</title>
<meta name="description" content="Try an AI receptionist for a real estate agency. Pretend you're a buyer and send a message.">
<style>
:root {
  --bg: #e9e4dc; --panel: #f7f5f1; --head: #1f3d36; --head-fg: #ffffff;
  --in: #ffffff; --out: #d6f1c6; --fg: #15201c; --muted: #66706b;
  --accent: #1f8a5b; --card: #ffffff; --line: #d9d3c8; --warn: #9a6a00;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0d1513; --panel: #131c19; --head: #18302a; --head-fg: #eef3f1;
  --in: #1d2925; --out: #1f4a36; --fg: #e8eeeb; --muted: #93a19b;
  --accent: #4fc68c; --card: #1a2420; --line: #2a3632; --warn: #e8b23a;
  color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); color: var(--fg); font: 15px/1.45 var(--font); display: flex; justify-content: center; }
.app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
header { background: var(--head); color: var(--head-fg); display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #e7c873; color: #1f3d36; display: grid; place-items: center; font-weight: 700; flex: none; }
.who { flex: 1; min-width: 0; }
.who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 12px; opacity: .8; }
.iconbtn { background: none; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.banner { background: var(--card); color: var(--muted); font-size: 12.5px; padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: center; }
.banner b { color: var(--fg); }
.chat { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.day { align-self: center; background: var(--card); color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 8px; margin: 4px 0; }
.msg { max-width: 82%; padding: 7px 10px 18px; border-radius: 10px; position: relative; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.msg.in { background: var(--in); align-self: flex-start; border-top-left-radius: 2px; }
.msg.out { background: var(--out); align-self: flex-end; border-top-right-radius: 2px; }
.msg time { position: absolute; right: 8px; bottom: 3px; font-size: 11px; color: var(--muted); }
.msg.out time::after { content: " ✓✓"; color: #34b7f1; }
.msg video { display: block; width: 100%; max-width: 260px; border-radius: 8px; margin-bottom: 4px; background: #000; }
.card { align-self: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; max-width: 92%; }
.card h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.card.handoff h3 { color: var(--warn); }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; }
.card dt { color: var(--muted); }
.card dd { margin: 0; }
.typing { align-self: flex-start; background: var(--in); border-radius: 10px; padding: 10px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px 8px; }
.chip { flex: none; background: var(--card); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.error { align-self: center; color: var(--warn); font-size: 13px; text-align: center; padding: 4px 10px; }
form { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
textarea { flex: 1; resize: none; border: 0; border-radius: 22px; padding: 10px 14px; font: inherit; background: var(--card); color: var(--fg); max-height: 120px; }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; flex: none; }
.send:disabled { opacity: .5; cursor: not-allowed; }
.agentbar { display: flex; justify-content: center; padding: 0 10px 6px; }
.agentbtn { background: none; border: 1px dashed var(--accent); color: var(--accent); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar">S</div>
    <div class="who"><b id="agency">Loading…</b><span id="status">AI receptionist · replies instantly</span></div>
    <button class="iconbtn" id="restart" type="button">Restart</button>
  </header>
  <div class="banner"><b>Demo:</b> you're chatting with an AI receptionist for a made-up agency. Pretend you're a buyer.</div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="agentbar" id="agentbar" hidden><button class="agentbtn" id="summaryBtn" type="button">See what the agent receives</button></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message" aria-label="Message" maxlength="600"></textarea>
    <button class="send" id="sendBtn" aria-label="Send">➤</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const KEY = "receptionist-demo-chat";
const STARTERS = ["Hi, what houses do you have for sale?", "Do you have a 2-bedroom for rent?", "How much is the East Legon house?", "Can I view a property this week?"];
let history = [];     // what the AI sees: {role, content}
let items = [];       // what the screen shows
let busy = false;

const nowTime = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ history, items })); } catch (e) {} };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render() {
  const chat = $("chat");
  chat.replaceChildren(el("div", "day", "Today"));
  for (const it of items) {
    if (it.kind === "msg") {
      const m = el("div", "msg " + it.dir);
      if (it.video) { const v = el("video"); v.src = it.video; v.controls = true; v.playsInline = true; v.preload = "metadata"; m.append(v); }
      if (it.text) m.append(document.createTextNode(it.text));
      m.append(el("time", null, it.time));
      chat.append(m);
    } else if (it.kind === "booked") {
      const c = el("div", "card"); c.append(el("h3", null, "✓ Viewing booked"));
      const dl = el("dl"); [["Who", it.name || "—"], ["Property", it.listing], ["When", it.slot]].forEach(([k, v]) => dl.append(el("dt", null, k), el("dd", null, v)));
      c.append(dl); chat.append(c);
    } else if (it.kind === "handoff") {
      const c = el("div", "card handoff"); c.append(el("h3", null, "Passed to the agent"), el("div", null, "In a real agency, the agent gets a notification to take over this chat."));
      chat.append(c);
    } else if (it.kind === "summary") {
      const c = el("div", "card"); c.append(el("h3", null, "What the agent receives"));
      const s = it.data, dl = el("dl");
      [["Lead score", s.score != null ? s.score + "/100 · " + s.temperature : ""], ["Name", s.name], ["Looking to", s.looking_for], ["Wants", [s.bedrooms && s.bedrooms + " bed", s.property_type, s.areas].filter(Boolean).join(", ")], ["Budget", s.budget], ["Timeline", s.timeline], ["Payment", s.payment], ["Purpose", s.purpose], ["Liked", s.interested_listing], ["Viewing", s.viewing], ["Still to ask", (s.missing || []).join(", ")], ["Next step", s.next_step]]
        .forEach(([k, v]) => dl.append(el("dt", null, k), el("dd", null, v || "—")));
      c.append(dl); chat.append(c);
    } else if (it.kind === "error") chat.append(el("div", "error", it.text));
  }
  if (busy) { const t = el("div", "typing"); t.append(el("i"), el("i"), el("i")); chat.append(t); }
  chat.scrollTop = chat.scrollHeight;
  $("chips").hidden = history.length > 0;
  $("agentbar").hidden = history.filter((m) => m.role === "user").length < 2;
  $("sendBtn").disabled = busy;
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || "Something went wrong. Try again.");
  return json;
}

async function sendText(text) {
  text = text.trim();
  if (!text || busy) return;
  items = items.filter((i) => i.kind !== "error");
  history.push({ role: "user", content: text });
  items.push({ kind: "msg", dir: "out", text, time: nowTime() });
  busy = true; render();
  try {
    const r = await post("/api/chat", { messages: history });
    history.push({ role: "assistant", content: r.text || "" });
    const video = r.actions.find((a) => a.type === "video");
    if (r.text || video) items.push({ kind: "msg", dir: "in", text: r.text, video: video && video.url, time: nowTime() });
    for (const a of r.actions) {
      if (a.type === "booked") items.push({ kind: "booked", ...a });
      if (a.type === "handoff") items.push({ kind: "handoff" });
    }
  } catch (e) {
    history.pop(); items.pop();
    items.push({ kind: "error", text: e.message });
    $("input").value = text;
  }
  busy = false; save(); render();
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; sendText(t); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("restart").addEventListener("click", () => { history = []; items = []; save(); render(); });
$("summaryBtn").addEventListener("click", async () => {
  if (busy) return;
  busy = true; render();
  try { items.push({ kind: "summary", data: await post("/api/summary", { messages: history }) }); }
  catch (e) { items.push({ kind: "error", text: e.message }); }
  busy = false; save(); render();
});
STARTERS.forEach((s) => { const b = el("button", "chip", s); b.type = "button"; b.onclick = () => sendText(s); $("chips").append(b); });

fetch("/api/agency").then((r) => r.json()).then((a) => {
  $("agency").textContent = a.agencyName;
  $("avatar").textContent = (a.agencyName || "A").trim()[0];
  document.title = a.agencyName + " · AI Receptionist Demo";
}).catch(() => { $("agency").textContent = "Demo agency"; });
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) { history = s.history || []; items = s.items || []; } } catch (e) {}
render();
</script>
</body>
</html>
