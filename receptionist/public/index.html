<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<meta name="description" content="Message us about properties for sale or rent, prices and viewings.">
<meta name="theme-color" content="#075e54" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2c34" media="(prefers-color-scheme: dark)">
<style>
:root {
  --page: #d1d7db; --wall: #efeae2; --dots: rgba(0,0,0,.035);
  --head: #075e54; --head-fg: #ffffff; --head-sub: rgba(255,255,255,.8);
  --in: #ffffff; --out: #d9fdd3; --fg: #111b21; --muted: #667781;
  --pill: #ffffff; --notice: #ffeecd; --notice-fg: #54656f;
  --bar: #f0f2f5; --field: #ffffff; --accent: #00a884; --tick: #53bdeb;
  --menu: #ffffff; --line: #e9edef; --warn: #b4520a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --page: #0c1317; --wall: #0b141a; --dots: rgba(255,255,255,.025);
  --head: #1f2c34; --head-fg: #e9edef; --head-sub: #8696a0;
  --in: #202c33; --out: #005c4b; --fg: #e9edef; --muted: #8696a0;
  --pill: #182229; --notice: #182229; --notice-fg: #ffd279;
  --bar: #1f2c34; --field: #2a3942; --accent: #00a884; --tick: #53bdeb;
  --menu: #233138; --line: #2a3942; --warn: #f2a65a;
  color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--fg); font: 15px/1.4 var(--font); display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
.app { position: relative; width: 100%; max-width: 520px; height: 100%; height: 100dvh; display: flex; flex-direction: column; background: var(--wall); }
svg { display: block; }

header { background: var(--head); color: var(--head-fg); display: flex; align-items: center; gap: 6px; padding: calc(8px + env(safe-area-inset-top, 0px)) 4px 8px 6px; flex: none; }
.back { width: 28px; height: 40px; display: grid; place-items: center; opacity: .95; }
.avatar { width: 40px; height: 40px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 18px; flex: none; background: linear-gradient(135deg, #c9a24a, #8a6a24); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who { flex: 1; min-width: 0; padding-left: 4px; }
.who b { display: block; font-weight: 600; font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { display: block; font-size: 13px; color: var(--head-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { width: 40px; height: 40px; display: grid; place-items: center; background: none; border: 0; color: inherit; border-radius: 50%; cursor: pointer; padding: 0; }
.hbtn:hover { background: rgba(255,255,255,.1); }

.menu { position: absolute; top: calc(52px + env(safe-area-inset-top, 0px)); right: 8px; background: var(--menu); color: var(--fg); border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.22); padding: 6px 0; z-index: 5; min-width: 190px; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 11px 20px; cursor: pointer; }
.menu button:hover { background: var(--bar); }

.chat { flex: 1; overflow-y: auto; padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 3px;
  background-color: var(--wall);
  background-image: radial-gradient(var(--dots) 1.2px, transparent 1.3px), radial-gradient(var(--dots) 1.2px, transparent 1.3px);
  background-size: 22px 22px; background-position: 0 0, 11px 11px; }
.pill { align-self: center; background: var(--pill); color: var(--muted); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; margin: 6px 0; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.notice { align-self: center; background: var(--notice); color: var(--notice-fg); font-size: 12.5px; line-height: 1.45; text-align: center; padding: 6px 12px; border-radius: 8px; margin: 2px 8px 10px; max-width: 340px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }

.msg { max-width: 82%; padding: 6px 8px 8px 9px; border-radius: 8px; position: relative; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px .5px rgba(11,20,26,.13); font-size: 15px; }
.msg.in { background: var(--in); align-self: flex-start; }
.msg.out { background: var(--out); align-self: flex-end; }
.msg.first { margin-top: 8px; }
.msg.in.first { border-top-left-radius: 0; }
.msg.out.first { border-top-right-radius: 0; }
.msg.in.first::before, .msg.out.first::before { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
.msg.in.first::before { left: -8px; background: var(--in); clip-path: polygon(0 0, 100% 0, 100% 100%); }
.msg.out.first::before { right: -8px; background: var(--out); clip-path: polygon(0 0, 100% 0, 0 100%); }
.meta { float: right; margin: 6px 0 -4px 10px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; position: relative; top: 4px; }
.ticks { color: var(--muted); }
.ticks.read { color: var(--tick); }

.card { align-self: center; background: var(--in); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; width: min(100%, 360px); margin: 8px 0; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.card h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.card.handoff h3 { color: var(--warn); }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 6px 0 0; }
.card dt { color: var(--muted); }
.card dd { margin: 0; overflow-wrap: anywhere; }

.typing { align-self: flex-start; background: var(--in); border-radius: 0 8px 8px 8px; padding: 12px 14px; display: flex; gap: 4px; margin-top: 8px; position: relative; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.typing::before { content: ""; position: absolute; top: 0; left: -8px; width: 8px; height: 13px; background: var(--in); clip-path: polygon(0 0, 100% 0, 100% 100%); }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
.error { align-self: center; background: var(--pill); color: var(--warn); font-size: 13px; text-align: center; padding: 6px 12px; border-radius: 8px; margin: 6px 0; }

form { display: flex; align-items: flex-end; gap: 6px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: transparent; flex: none; }
.field { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--field); border-radius: 24px; padding: 0 6px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.field .ico { width: 36px; height: 46px; display: grid; place-items: center; color: var(--muted); flex: none; }
textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: none; padding: 13px 2px; font: inherit; font-size: 16px; line-height: 20px; background: transparent; color: var(--fg); max-height: 120px; }
textarea::placeholder { color: var(--muted); }
.send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; flex: none; display: grid; place-items: center; padding: 0; }
.send:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="back" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></span>
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div class="who"><b id="agency">&nbsp;</b><span id="status">online</span></div>
    <button class="hbtn" id="menuBtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>
  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" id="summaryBtn">Lead summary</button>
    <button type="button" role="menuitem" id="clearBtn">Clear chat</button>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <form id="form">
    <div class="field">
      <span class="ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg></span>
      <textarea id="input" rows="1" placeholder="Message" aria-label="Message" maxlength="600"></textarea>
    </div>
    <button class="send" id="sendBtn" aria-label="Send"></button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const DEMO = (location.pathname.match(/^\/d\/([a-z0-9-]+)/) || [])[1] || "";
const KEY = "receptionist-demo-chat" + (DEMO ? "-" + DEMO : "");
const ICON_SEND = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>';
const ICON_MIC = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.9V22h2v-3.1a7 7 0 0 0 6-6.9h-1.7z"/></svg>';
let agency = { agencyName: "", receptionistName: "Anna" };
let history = [];     // what the AI sees: {role, content}
let items = [];       // what the screen shows
let started = "";     // time the greeting appeared
let busy = false;

const nowTime = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ history, items, started })); } catch (e) {} };
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const ticks = (read) => { const s = el("span", "ticks" + (read ? " read" : "")); s.innerHTML = '<svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M11.1.6 4.9 7.9 2 5.2.9 6.3l4.1 3.9L12.2 1.6zM15.1.6 8.9 7.9l-.9-.8-1.1 1.2 2.1 1.9L16.2 1.6z"/></svg>'; return s; };

const greeting = () => "Hello! 👋 Welcome to " + agency.agencyName + ". I'm " + agency.receptionistName + ". How can I help you today?";
// The AI sees the greeting too, so it doesn't say hello a second time.
const withGreeting = () => agency.agencyName ? [{ role: "assistant", content: greeting() }, ...history] : history;

function bubble(dir, text, time, first, read) {
  const m = el("div", "msg " + dir + (first ? " first" : ""));
  m.append(document.createTextNode(text));
  const meta = el("span", "meta"); meta.append(el("span", null, time));
  if (dir === "out") meta.append(ticks(read));
  m.append(meta);
  return m;
}

function render() {
  const chat = $("chat");
  chat.replaceChildren(el("div", "pill", "Today"));
  if (agency.agencyName) chat.append(
    el("div", "notice", "🔒 Messages here are answered by " + agency.receptionistName + ", " + agency.agencyName + "'s AI assistant."),
    bubble("in", greeting(), started || nowTime(), true));
  let lastDir = "in";
  for (const it of items) {
    if (it.kind === "msg") {
      chat.append(bubble(it.dir, it.text, it.time, it.dir !== lastDir, it.read));
      lastDir = it.dir;
      continue;
    }
    lastDir = "";
    if (it.kind === "booked") {
      const furn = agency.kind === "furniture";
      const c = el("div", "card"); c.append(el("h3", null, furn ? "✓ Visit booked" : "✓ Viewing booked"));
      const dl = el("dl"); [["Who", it.name || "—"], [furn ? "Item" : "Property", it.listing], ["When", it.slot]].forEach(([k, v]) => dl.append(el("dt", null, k), el("dd", null, v)));
      c.append(dl); chat.append(c);
    } else if (it.kind === "handoff") {
      const c = el("div", "card handoff"); c.append(el("h3", null, "Passed to the team"), el("div", null, "A member of the team has been notified and will take over this chat."));
      chat.append(c);
    } else if (it.kind === "summary") {
      const c = el("div", "card"); c.append(el("h3", null, "Lead summary (what the agent receives)"));
      const s = it.data, dl = el("dl");
      (s.rows || [["Lead score", s.score != null ? s.score + "/100 · " + s.temperature : ""], ["Name", s.name], ["Looking to", s.looking_for], ["Wants", [s.bedrooms && s.bedrooms + " bed", s.property_type, s.areas].filter(Boolean).join(", ")], ["Budget", s.budget], ["Timeline", s.timeline], ["Payment", s.payment], ["Purpose", s.purpose], ["Liked", s.interested_listing], ["Viewing", s.viewing], ["Still to ask", (s.missing || []).join(", ")], ["Next step", s.next_step]])
        .forEach(([k, v]) => dl.append(el("dt", null, k), el("dd", null, v || "—")));
      c.append(dl); chat.append(c);
    } else if (it.kind === "error") chat.append(el("div", "error", it.text));
  }
  if (busy) { const t = el("div", "typing"); t.append(el("i"), el("i"), el("i")); chat.append(t); }
  chat.scrollTop = chat.scrollHeight;
  $("status").textContent = busy ? "typing…" : "online";
  $("summaryBtn").disabled = history.filter((m) => m.role === "user").length < 1;
  updateSend();
}

function updateSend() {
  const hasText = $("input").value.trim().length > 0;
  const b = $("sendBtn");
  b.innerHTML = hasText ? ICON_SEND : ICON_MIC;
  b.setAttribute("aria-label", hasText ? "Send" : "Voice message (not available)");
  b.disabled = busy;
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || "Message not delivered. Tap send to try again.");
  return json;
}

async function sendText(text) {
  text = text.trim();
  if (!text || busy) return;
  items = items.filter((i) => i.kind !== "error");
  history.push({ role: "user", content: text });
  const mine = { kind: "msg", dir: "out", text, time: nowTime(), read: false };
  items.push(mine);
  busy = true; render();
  try {
    const r = await post("/api/chat", { messages: withGreeting(), demo: DEMO });
    mine.read = true;
    history.push({ role: "assistant", content: r.text || "" });
    if (r.text) items.push({ kind: "msg", dir: "in", text: r.text, time: nowTime() });
    for (const a of r.actions || []) {
      if (a.type === "booked") items.push({ kind: "booked", ...a });
      if (a.type === "handoff") items.push({ kind: "handoff" });
    }
  } catch (e) {
    history.pop(); items.pop();
    items.push({ kind: "error", text: e.message });
    $("input").value = text;
  }
  busy = false; save(); render();
}

function grow() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }
function closeMenu() { $("menu").hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); }

$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("input").value; if (!t.trim()) { $("input").focus(); return; } $("input").value = ""; grow(); sendText(t); });
$("input").addEventListener("input", () => { grow(); updateSend(); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(pointer: fine)").matches) { e.preventDefault(); $("form").requestSubmit(); } });
$("menuBtn").addEventListener("click", (e) => { e.stopPropagation(); const open = $("menu").hidden; $("menu").hidden = !open; $("menuBtn").setAttribute("aria-expanded", String(open)); });
document.addEventListener("click", (e) => { if (!$("menu").contains(e.target)) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
$("clearBtn").addEventListener("click", () => { closeMenu(); history = []; items = []; started = nowTime(); save(); render(); });
$("summaryBtn").addEventListener("click", async () => {
  closeMenu();
  if (busy || !history.length) return;
  busy = true; render(); $("status").textContent = "online";
  try { items.push({ kind: "summary", data: await post("/api/summary", { messages: history, demo: DEMO }) }); }
  catch (e) { items.push({ kind: "error", text: e.message }); }
  busy = false; save(); render();
});

try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) { history = s.history || []; items = s.items || []; started = s.started || ""; } } catch (e) {}
if (!started) { started = nowTime(); save(); }
fetch("/api/agency" + (DEMO ? "?demo=" + encodeURIComponent(DEMO) : "")).then((r) => r.json()).then((a) => {
  agency = { ...agency, ...a };
  $("agency").textContent = a.agencyName;
  $("avatar").textContent = (a.agencyName || "A").trim()[0].toUpperCase();
  // A personalised demo can have the agency's own picture at /avatars/<code>.jpg.
  if (DEMO) { const img = new Image(); img.alt = ""; img.onload = () => $("avatar").replaceChildren(img); img.src = "/avatars/" + DEMO + ".jpg"; }
  document.title = a.agencyName;
  render();
}).catch(() => render());
render();
</script>
</body>
</html>
