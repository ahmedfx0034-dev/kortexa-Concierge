<title>Kortexa Month Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first editable plan. Sticky filter bar, one compact row-card per scheduled carousel, inline edit panel. Brand: black/lime. */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --fg:#030305; --muted:#5c6157; --line:#e1e4dc;
  --lime:#98CC13; --lime-ink:#6FA00B; --lime-soft:#eef6da; --warn:#9a5b00; --warn-soft:#fff2d6; --bad:#b3261e; --chip:#eceee8;
  --display:"Montserrat","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030305; --surface:#101113; --fg:#f2f3ef; --muted:#9a9f95; --line:#24262a;
  --lime:#98CC13; --lime-ink:#98CC13; --lime-soft:#1a2309; --warn:#f0b459; --warn-soft:#33270f; --bad:#ff8a80; --chip:#1b1d20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#030305; --surface:#101113; --fg:#f2f3ef; --muted:#9a9f95; --line:#24262a;
  --lime:#98CC13; --lime-ink:#98CC13; --lime-soft:#1a2309; --warn:#f0b459; --warn-soft:#33270f; --bad:#ff8a80; --chip:#1b1d20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px;display:flex;flex-direction:column;gap:16px}
h1{font:800 clamp(1.6rem,5vw,2.2rem)/1.1 var(--display);text-transform:uppercase;margin:0;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--lime-ink)}
.eyebrow{font:700 .72rem var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--lime-ink)}
.bar-accent{width:48px;height:5px;background:var(--lime);border-radius:3px}
p{margin:0}.muted{color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;font:500 .82rem var(--body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{font:600 .78rem var(--body);padding:3px 9px;border-radius:999px;background:var(--chip);font-variant-numeric:tabular-nums}
.count.ok{background:var(--lime-soft);color:var(--lime-ink)}.count.warn{background:var(--warn-soft);color:var(--warn)}
.day{font:800 .8rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item[data-state="ok"]{box-shadow:inset 4px 0 0 var(--lime)}
.item[data-state="change"]{box-shadow:inset 4px 0 0 var(--warn)}
.item[data-state="skip"]{opacity:.55}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem}
.tag{font:600 .7rem var(--body);padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag.offer{background:var(--fg);color:var(--lime)}
.tag.fmt{background:var(--lime-soft);color:var(--lime-ink)}
.time{font:700 .82rem var(--body);font-variant-numeric:tabular-nums}
.state{margin-left:auto;font:600 .76rem var(--body)}
.title{font:700 1rem/1.3 var(--body)}
.hook{font:800 .86rem/1.3 var(--display);text-transform:uppercase;color:var(--lime-ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font:600 .84rem var(--body);cursor:pointer}
.btn.ok{background:var(--lime);border-color:var(--lime);color:#030305}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.edit{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
label{font:600 .76rem var(--body);color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:14px/1.45 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
.notice{border-radius:10px;padding:10px 12px;font-size:.9rem;background:var(--warn-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <span class="eyebrow">Kortexa · content plan</span>
    <h1>Your month of <em>carousels</em></h1>
    <div class="bar-accent"></div>
    <p class="muted">Every topic I'll write, in posting order (times are GMT). Mark each one OK, change the title, hook or angle, or skip it. I write the carousels from what you approve here.</p>
  </header>
  <div class="bar">
    <div class="row" id="counts"></div>
    <div class="row" id="filters" role="toolbar" aria-label="Filter"></div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="list" style="display:flex;flex-direction:column;gap:8px"><div class="empty">Loading plan…</div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(async function(){
  const $=s=>document.querySelector(s);
  const PILLAR={"mistakes":"Mistakes & fixes","how-to":"How-to","before-after":"Before & after","speed":"Speed & replies","ai-explained":"AI explained","growth":"Agency growth","offer":"Offer"};
  const STATE={ok:"OK ✓",change:"Changes asked",skip:"Skipped",pending:"Not reviewed"};
  let plan=[], edits={}, db=null, writable=false, filter="all", open=null;
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2000)}
  const val=(p,k)=>edits[p.slot_id]?.[k] ?? p[k];
  const st=p=>edits[p.slot_id]?.status||"pending";
  const fmtDay=d=>new Date(d+"T12:00:00Z").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});

  try{plan=await (await fetch("plan.json")).json()}catch(e){$("#list").innerHTML='<div class="empty">No plan yet.</div>';return}

  function render(){
    const c={pending:0,ok:0,change:0,skip:0}; plan.forEach(p=>c[st(p)]++);
    $("#counts").innerHTML=`<span class="count">${plan.length} carousels</span><span class="count">${c.pending} to review</span><span class="count ok">${c.ok} OK</span><span class="count warn">${c.change} changes</span><span class="count">${c.skip} skipped</span>`;
    const opts=[["all","All"],["week1","First 7 days"],["pending","To review"],["offer","Offers"],["photos","Needs photos"]];
    $("#filters").innerHTML=opts.map(([k,l])=>`<button class="pill" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
    const first=plan[0]?.date; const wk=new Date(first+"T00:00:00Z"); wk.setUTCDate(wk.getUTCDate()+7); const wkEnd=wk.toISOString().slice(0,10);
    const shown=plan.filter(p=>filter==="all"||(filter==="week1"&&p.date<wkEnd)||(filter==="pending"&&st(p)==="pending")||(filter==="offer"&&p.pillar==="offer")||(filter==="photos"&&p.needs_photos));
    let html="",last=""; for(const p of shown){ if(p.date!==last){html+=`<div class="day">${fmtDay(p.date)}</div>`;last=p.date} html+=item(p) }
    $("#list").innerHTML=html||'<div class="empty">Nothing here.</div>';
  }
  function item(p){
    const s=st(p), isOpen=open===p.slot_id;
    return `<article class="item" data-id="${p.slot_id}" data-state="${s}">
      <div class="meta"><span class="time">${p.time}</span>${p.style?`<span class="tag fmt">${esc(p.style.replace("kortexa-",""))}</span>`:""}
      <span class="tag ${p.pillar==="offer"?"offer":""}">${esc(PILLAR[p.pillar]||p.pillar)}</span><span class="tag">CTA: ${esc(val(p,"cta"))}</span>
      ${p.needs_photos?'<span class="tag">needs photos</span>':""}<span class="state">${STATE[s]}</span></div>
      <div class="title">${esc(val(p,"title"))}</div><div class="hook">${esc(val(p,"hook"))}</div>
      <p class="muted">${esc(val(p,"angle"))}</p>
      ${edits[p.slot_id]?.note?`<p><b>Your note:</b> ${esc(edits[p.slot_id].note)}</p>`:""}
      ${isOpen?`<div class="edit">
        <label>Title<input id="t-${p.slot_id}" value="${esc(val(p,"title"))}"></label>
        <label>Hook (slide 1)<input id="h-${p.slot_id}" value="${esc(val(p,"hook"))}"></label>
        <label>Angle<textarea id="a-${p.slot_id}">${esc(val(p,"angle"))}</textarea></label>
        <label>Call to action<select id="c-${p.slot_id}">${["LISTING","SAVE","DM"].map(o=>`<option ${val(p,"cta")===o?"selected":""}>${o}</option>`).join("")}</select></label>
        <label>Note for me (optional)<textarea id="n-${p.slot_id}" placeholder="e.g. use an East Legon example">${esc(edits[p.slot_id]?.note||"")}</textarea></label>
        <div class="acts"><button class="btn ok" data-a="save">Save as OK</button><button class="btn warn" data-a="savechange">Save and ask me to rethink</button><button class="btn" data-a="close">Cancel</button></div></div>`:""}
      <div class="acts">${isOpen?"":`<button class="btn ok" data-a="ok" ${writable?"":"disabled"}>OK</button><button class="btn" data-a="edit" ${writable?"":"disabled"}>Edit</button><button class="btn" data-a="skip" ${writable?"":"disabled"}>Skip</button>`}</div>
    </article>`;
  }
  async function save(id,doc){
    if(!db){toast("Open in the Claude app to save");return}
    edits[id]={...(edits[id]||{}),...doc,updated_at:new Date().toISOString()}; render();
    try{await db.doc("plan/"+id).set(edits[id]);toast("Saved")}catch(e){toast("Not saved: "+(e?.message||"try again"))}
  }
  document.addEventListener("click",e=>{
    const f=e.target.closest("[data-f]"); if(f){filter=f.dataset.f;render();return}
    const b=e.target.closest("[data-a]"); if(!b)return; const id=b.closest(".item").dataset.id; const a=b.dataset.a;
    if(a==="edit"){open=id;render();document.getElementById("t-"+id)?.focus();return}
    if(a==="close"){open=null;render();return}
    if(a==="ok")return save(id,{status:"ok"});
    if(a==="skip")return save(id,{status:"skip"});
    if(a==="save"||a==="savechange"){
      const g=k=>document.getElementById(k+"-"+id).value.trim();
      open=null; return save(id,{status:a==="save"?"ok":"change",title:g("t"),hook:g("h"),angle:g("a"),cta:g("c"),note:g("n")});
    }
  });
  render();
  db=await (window.claude?.use?claude.use("db"):null);
  if(!db){$("#notice").hidden=false;$("#notice").textContent="Read-only view. Open this page in the Claude app while signed in to make changes.";return}
  writable=true; render();
  const t=setTimeout(()=>{$("#notice").hidden=false;$("#notice").textContent="Still loading your earlier changes…"},10000);
  db.collection("plan").onSnapshot(snap=>{clearTimeout(t);$("#notice").hidden=true;const n={};(snap.docs||snap).forEach(d=>{n[d.id]=typeof d.data==="function"?d.data():d.data});edits=n;render()},
    err=>{clearTimeout(t);$("#notice").hidden=false;$("#notice").textContent="Couldn't load changes: "+(err?.message||"error")});
})();
</script>
