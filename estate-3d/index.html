<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MED Property — 3D Homes</title>
<meta name="description" content="Explore every MED Property listing in 3D: walk the estate, then step inside each home room by room.">
<meta name="theme-color" content="#0f1b2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1b2a;
    --navy-2: #1a2b40;
    --gold: #c9a227;
    --gold-2: #e3c25a;
    --ink: #0f172a;
    --muted: #5b6577;
    --card: rgba(255,255,255,0.94);
    --line: rgba(15,23,42,0.10);
    --radius: 16px;
    --shadow: 0 10px 30px rgba(15,23,42,0.18);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f2; font-family: Inter, system-ui, sans-serif; color: var(--ink); }
  canvas#scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  button { font: inherit; cursor: pointer; border: 0; }

  /* ---------- top bar ---------- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; z-index: 20; pointer-events: none; }
  .brand { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 8px 14px 8px 8px; border-radius: 999px; box-shadow: var(--shadow); text-decoration: none; }
  .brand .mark { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .5px; }
  .brand .name { font-family: 'Playfair Display', serif; font-size: 17px; line-height: 1; }
  .brand .sub { font-size: 10.5px; opacity: .7; letter-spacing: .4px; text-transform: uppercase; margin-top: 3px; }
  .topbar .spacer { flex: 1; }
  .pill { pointer-events: auto; background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 999px; box-shadow: var(--shadow); padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .pill.dark { background: var(--navy); color: #fff; }
  .seg { pointer-events: auto; display: inline-flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { white-space: nowrap; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--navy); color: #fff; }

  /* ---------- hint ---------- */
  .hint { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: rgba(15,27,42,.85); color: #fff; font-size: 12.5px; padding: 8px 14px; border-radius: 999px; z-index: 15; pointer-events: none; transition: opacity .6s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }

  /* ---------- 3D labels ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .pin { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .pin .bubble { background: #fff; border-radius: 12px; padding: 6px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.2); text-align: center; white-space: nowrap; transition: transform .2s; }
  .pin .bubble b { display: block; font-size: 13px; color: var(--navy); }
  .pin .bubble span { font-size: 11px; color: var(--muted); }
  .pin .stem { width: 2px; height: 14px; background: #fff; }
  .pin.sel .bubble { background: var(--navy); transform: scale(1.06); }
  .pin.sel .bubble b { color: var(--gold-2); }
  .pin.sel .bubble span { color: #cbd5e1; }
  .pin:hover .bubble { transform: scale(1.06); }
  .tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; background: rgba(15,27,42,.88); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid rgba(255,255,255,.25); will-change: transform; }
  .tag:hover { background: var(--gold); color: var(--navy); }

  /* ---------- listing strip ---------- */
  .strip { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + var(--safe-b)); display: flex; gap: 12px; overflow-x: auto; z-index: 10; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 240px; scroll-snap-align: start; background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; border: 2px solid transparent; text-align: left; color: var(--ink); }
  .card.sel { border-color: var(--gold); }
  .card .st { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--gold); }
  .card .t { font-weight: 700; font-size: 14px; margin: 3px 0 2px; }
  .card .a { font-size: 12px; color: var(--muted); }
  .card .p { font-weight: 700; color: var(--navy); margin-top: 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .card .p small { font-weight: 500; color: var(--muted); font-size: 11.5px; }

  /* ---------- detail panel ---------- */
  .panel { position: fixed; z-index: 12; background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  @media (min-width: 761px) {
    .panel { top: 76px; right: 16px; width: 360px; border-radius: 20px; max-height: calc(100vh - 220px); overflow: auto; }
    .panel.hidden { transform: translateX(400px); opacity: 0; pointer-events: none; }
  }
  @media (max-width: 760px) {
    .panel { left: 0; right: 0; bottom: 0; border-radius: 20px 20px 0 0; max-height: 62vh; overflow: auto; padding-bottom: var(--safe-b); }
    .panel.hidden { transform: translateY(105%); pointer-events: none; }
    .card { flex-basis: 78vw; }
  }
  .panel .in { padding: 18px 18px 20px; }
  .panel .x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(15,23,42,.06); font-size: 18px; color: var(--muted); }
  .panel .st { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--gold); }
  .panel h2 { font-family: 'Playfair Display', serif; font-size: 23px; margin: 4px 36px 2px 0; line-height: 1.2; }
  .panel .area { color: var(--muted); font-size: 13.5px; }
  .panel .price { font-size: 22px; font-weight: 700; color: var(--navy); margin: 12px 0; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .facts div { background: rgba(15,23,42,.05); border-radius: 12px; padding: 8px; text-align: center; }
  .facts b { display: block; font-size: 16px; }
  .facts span { font-size: 11px; color: var(--muted); }
  .panel p { font-size: 13.5px; line-height: 1.5; color: #334155; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chips span { font-size: 11.5px; background: rgba(201,162,39,.14); color: #7a5f0f; padding: 4px 9px; border-radius: 999px; font-weight: 600; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border-radius: 12px; font-weight: 700; font-size: 14.5px; }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn.primary:hover { background: var(--navy-2); }
  .btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--navy); margin-top: 8px; }
  .btn.ghost { background: rgba(15,23,42,.06); color: var(--ink); margin-top: 8px; }
  .demo-note { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }

  /* ---------- tour HUD ---------- */
  .tourbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 16px calc(14px + var(--safe-b)); display: none; flex-direction: column; gap: 10px; pointer-events: none; }
  .tourbar.show { display: flex; }
  .rooms { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; padding: 2px; }
  .rooms::-webkit-scrollbar { display: none; }
  .rooms button { flex: 0 0 auto; background: var(--card); padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); color: var(--ink); }
  .rooms button.on { background: var(--gold); color: var(--navy); }
  .now { pointer-events: none; align-self: center; background: rgba(15,27,42,.85); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .now:empty { display: none; }

  .joy { position: fixed; left: 24px; bottom: calc(96px + var(--safe-b)); width: 120px; height: 120px; border-radius: 50%; background: rgba(15,27,42,.25); border: 2px solid rgba(255,255,255,.6); z-index: 11; display: none; touch-action: none; backdrop-filter: blur(4px); }
  .joy.show { display: block; }
  .joy .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 4px 12px rgba(0,0,0,.25); }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.show { display: flex; }
  .modal .box { background: #fff; border-radius: 20px; width: 100%; max-width: 400px; padding: 22px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 4px; font-family: 'Playfair Display', serif; font-size: 22px; }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  .modal input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); font: inherit; font-size: 15px; }

  /* ---------- loader ---------- */
  .loader { position: fixed; inset: 0; z-index: 50; background: var(--navy); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .6s; }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader .mark { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 18px; animation: pulse 1.4s infinite; }
  .loader .msg { font-size: 13px; opacity: .75; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .err { max-width: 420px; text-align: center; font-size: 14px; padding: 0 20px; line-height: 1.5; }

  @media (max-width: 760px) {
    .brand .sub { display: none; }
    .hide-sm { display: none !important; }
    .topbar { padding: 10px 12px; gap: 8px; }
    .seg button { padding: 7px 11px; }
    body.touring .brand .name { display: none; }
    body.touring .brand { padding-right: 8px; }
    .panel { max-height: 54vh; }
    .pill { white-space: nowrap; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div class="topbar">
  <a class="brand" id="brand" href="#">
    <div class="mark" id="brandMark">MED</div>
    <div><div class="name" id="brandName">MED Property</div><div class="sub">3D Property Showroom</div></div>
  </a>
  <button class="pill dark" id="backBtn" style="display:none">← All homes</button>
  <div class="spacer"></div>
  <div class="seg" id="modeSeg" style="display:none">
    <button data-mode="dollhouse" class="on">Floor plan</button>
    <button data-mode="walk">Walk inside</button>
  </div>
  <button class="pill hide-sm" id="infoBtn" style="display:none">Details</button>
</div>

<div class="hint" id="hint">Drag to look around · Tap a house to see details</div>

<div class="strip" id="strip"></div>

<aside class="panel hidden" id="panel">
  <button class="x" id="panelClose" aria-label="Close">×</button>
  <div class="in" id="panelBody"></div>
</aside>

<div class="tourbar" id="tourbar">
  <div class="now" id="nowRoom"></div>
  <div class="rooms" id="roomChips"></div>
</div>
<div class="joy" id="joy"><div class="knob" id="knob"></div></div>

<div class="modal" id="modal">
  <form class="box" id="bookForm">
    <h3>Book a viewing</h3>
    <div class="sub" id="bookSub"></div>
    <label for="bName">Your name</label><input id="bName" required autocomplete="name">
    <label for="bPhone">Phone / WhatsApp</label><input id="bPhone" required inputmode="tel" autocomplete="tel">
    <label for="bDate">Preferred date</label><input id="bDate" type="date">
    <button class="btn primary" style="margin-top:16px" type="submit">Request viewing</button>
    <button class="btn ghost" type="button" id="bookCancel">Cancel</button>
    <div class="demo-note">Demo: requests aren't sent anywhere yet.</div>
  </form>
</div>

<div class="loader" id="loader"><div class="mark">MED</div><div class="msg" id="loaderMsg">Building the estate…</div></div>

<script type="module" src="./app.js"></script>
</body>
</html>
