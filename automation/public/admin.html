<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kortexa Follow-ups</title>
<style>
:root { --bg:#08080a; --surface:#111113; --surface-2:#18181b; --line:#26262a; --fg:#f6f6f3; --muted:#95958f; --accent:#9cd116; --accent-ink:#0b0d05; --warn:#e8b23a; --bad:#e5604d; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg:#f7f7f2; --surface:#fff; --surface-2:#f0f0ea; --line:#dcdcd3; --fg:#141412; --muted:#5f5f58; --accent:#4d7a00; --accent-ink:#fff; --warn:#9a6a00; --bad:#b83a28; color-scheme: light; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
header { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
header h1 { font-size:18px; margin:0 auto 0 0; }
header h1 b { color:var(--accent); }
.badge { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
.badge.warn { color:var(--warn); }
.layout { display:grid; grid-template-columns:340px minmax(0,1fr); height:calc(100vh - 57px); }
@media (max-width:800px) { .layout { grid-template-columns:1fr; height:auto; } }
.left { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.tools { padding:12px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); }
.field { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; width:100%; }
.btn { border:1px solid var(--line); background:var(--surface-2); padding:7px 12px; border-radius:8px; cursor:pointer; font-weight:500; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.leads { overflow:auto; flex:1; }
.lead { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
.lead[aria-current="true"] { background:var(--surface-2); }
.lead .n { font-weight:600; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.lead .s { color:var(--muted); font-size:12px; }
.pill { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:1px 7px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
.pill.hot { color:var(--accent); } .pill.warn { color:var(--warn); } .pill.bad { color:var(--bad); }
.right { display:flex; flex-direction:column; min-height:0; }
.head { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
.head h2 { margin:0 auto 0 0; font-size:16px; }
.chat { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
.msg { max-width:78%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.in { background:var(--surface-2); align-self:flex-start; border-bottom-left-radius:3px; }
.msg.out { background:color-mix(in srgb, var(--accent) 18%, var(--surface)); align-self:flex-end; border-bottom-right-radius:3px; }
.msg small { display:block; color:var(--muted); font-size:11px; margin-top:4px; }
.compose { border-top:1px solid var(--line); padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
.compose textarea { min-height:80px; resize:vertical; }
.note { color:var(--muted); font-size:13px; }
.draft { border:1px dashed var(--accent); border-radius:10px; padding:8px 10px; }
.empty { color:var(--muted); padding:40px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>KORTEX<b>A</b> Follow-ups</h1>
  <span class="badge" id="mode"></span>
  <span class="badge" id="sent"></span>
  <button class="btn" id="tick">Send due follow-ups now</button>
</header>
<div class="layout">
  <div class="left">
    <div class="tools">
      <label class="note" for="csv">Import the "replied" CSV from the outreach dashboard</label>
      <div class="row"><input type="file" id="csv" accept=".csv,text/csv" class="field" style="flex:1"><button class="btn" id="importBtn">Import</button></div>
      <div class="note" id="importNote"></div>
      <div class="row">
        <input id="search" class="field" placeholder="Search" style="flex:1" aria-label="Search leads">
        <select id="filter" class="field" style="width:auto" aria-label="Filter">
          <option value="">All</option><option value="attention">Needs you</option><option value="active">Active</option>
          <option value="demo">Demo booked</option><option value="new">Not contacted yet</option><option value="closed">Closed</option>
        </select>
      </div>
    </div>
    <div class="leads" id="leads"></div>
  </div>
  <div class="right" id="right"><div class="empty">Pick a lead on the left.</div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const when = (t) => t ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
const LABEL = { new:"Not contacted", active:"Active", demo:"Demo booked", won:"Customer", lost:"Not interested", opted_out:"Opted out" };
let state = { leads: [] }, current = null;

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || "Request failed");
  return json;
}
async function load() {
  state = await api("/api/state");
  $("mode").textContent = (state.dryRun ? "Dry run (not sending)" : "Live") + " · AI: " + state.aiMode;
  $("mode").classList.toggle("warn", state.dryRun);
  $("sent").textContent = state.sentLast24h + " / " + state.dailyCap + " sent in 24h";
  renderList(); renderLead();
}
function needsYou(l) { return !!l.draft || l.needsHuman || (l.lastInboundAt > l.lastOutboundAt && l.status !== "opted_out"); }
function renderList() {
  const q = $("search").value.toLowerCase(), f = $("filter").value;
  const rows = state.leads.filter((l) => {
    if (q && !(l.name + " " + l.waId + " " + l.city).toLowerCase().includes(q)) return false;
    if (f === "attention") return needsYou(l);
    if (f === "closed") return ["won", "lost", "opted_out"].includes(l.status);
    return !f || l.status === f;
  });
  $("leads").innerHTML = rows.length ? rows.map((l) => {
    const pills = [needsYou(l) ? '<span class="pill hot">Needs you</span>' : "", l.paused ? '<span class="pill warn">Paused</span>' : "",
      '<span class="pill ' + (l.status === "opted_out" || l.status === "lost" ? "bad" : "") + '">' + esc(LABEL[l.status] || l.status) + "</span>"].join("");
    const last = l.messages[l.messages.length - 1];
    return '<div class="lead" tabindex="0" data-id="' + l.waId + '" aria-current="' + (l.waId === current) + '"><div class="n">' + esc(l.name || l.pretty) + pills + '</div><div class="s">' + esc(l.pretty) + (l.city ? " · " + esc(l.city) : "") + (last ? " · " + esc(last.text.slice(0, 60)) : "") + "</div></div>";
  }).join("") : '<div class="empty">No leads here yet.</div>';
}
function renderLead() {
  const l = state.leads.find((x) => x.waId === current);
  if (!l) { $("right").innerHTML = '<div class="empty">Pick a lead on the left.</div>'; return; }
  const msgs = l.messages.map((m) => '<div class="msg ' + m.direction + '">' + esc(m.text) + "<small>" + when(m.at) + (m.direction === "out" ? " · " + esc(m.by || "") + (m.status ? " · " + esc(m.status) : "") + (m.error ? " · " + esc(m.error) : "") : "") + "</small></div>").join("");
  const draft = l.draft ? '<div class="draft"><div class="note">Suggested reply (' + esc(l.draft.intent) + ")</div><div>" + esc(l.draft.text) + '</div><div class="row" style="margin-top:6px"><button class="btn primary" id="useDraft">Send this</button><button class="btn" id="editDraft">Edit</button><button class="btn" id="dropDraft">Discard</button></div></div>' : "";
  const windowNote = l.windowOpen ? "You can send any message until 24 hours after their last message." : "The 24-hour window is closed. Only the approved follow-up templates can be sent until they write again.";
  $("right").innerHTML =
    '<div class="head"><h2>' + esc(l.name || l.pretty) + '</h2><span class="note">' + esc(l.pretty) + (l.meetingTime ? " · Call: " + esc(l.meetingTime) : "") + "</span>" +
    '<select id="status" class="field" style="width:auto" aria-label="Status">' + Object.entries(LABEL).map(([k, v]) => '<option value="' + k + '"' + (k === l.status ? " selected" : "") + ">" + v + "</option>").join("") + "</select>" +
    '<label class="note"><input type="checkbox" id="paused"' + (l.paused ? " checked" : "") + "> Pause automatic messages</label></div>" +
    '<div class="chat" id="chat">' + (msgs || '<div class="empty">No messages yet.' + (l.status === "new" ? " The opener template goes out at the next follow-up run." : "") + "</div>") + "</div>" +
    '<div class="compose">' + draft + '<textarea id="reply" class="field" placeholder="Type a reply" aria-label="Reply"' + (l.windowOpen ? "" : " disabled") + '></textarea><div class="row"><button class="btn primary" id="send"' + (l.windowOpen ? "" : " disabled") + '>Send</button><span class="note">' + windowNote + "</span></div>" +
    '<input id="notes" class="field" placeholder="Notes" value="' + esc(l.notes) + '" aria-label="Notes"></div>';
  const chat = $("chat"); chat.scrollTop = chat.scrollHeight;
  $("status").onchange = (e) => update({ status: e.target.value });
  $("paused").onchange = (e) => update({ paused: e.target.checked });
  $("notes").onchange = (e) => update({ notes: e.target.value });
  $("send").onclick = () => reply($("reply").value);
  if (l.draft) {
    $("useDraft").onclick = () => reply(l.draft.text);
    $("editDraft").onclick = () => { $("reply").value = l.draft.text; $("reply").focus(); };
    $("dropDraft").onclick = () => update({ draft: null, needsHuman: false });
  }
}
async function update(body) {
  try { await api("/api/leads/" + current, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); await load(); }
  catch (e) { alert(e.message); }
}
async function reply(text) {
  if (!text.trim()) return;
  try { await api("/api/leads/" + current + "/reply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) }); await update({ needsHuman: false }); }
  catch (e) { alert(e.message); }
}
$("leads").addEventListener("click", (e) => { const el = e.target.closest("[data-id]"); if (el) { current = el.dataset.id; renderList(); renderLead(); } });
$("leads").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.click(); });
$("search").oninput = renderList; $("filter").onchange = renderList;
$("importBtn").onclick = async () => {
  const f = $("csv").files[0];
  if (!f) { $("importNote").textContent = "Choose the CSV file first."; return; }
  try {
    const r = await api("/api/import", { method: "POST", headers: { "Content-Type": "text/csv" }, body: await f.text() });
    $("importNote").textContent = `Added ${r.added}. Already here: ${r.skipped}. Bad numbers: ${r.invalid}.`;
    await load();
  } catch (e) { $("importNote").textContent = e.message; }
};
$("tick").onclick = async () => {
  try { const r = await api("/api/tick", { method: "POST" }); alert(r.skipped ? `Sent ${r.sent}. Stopped: ${r.skipped}.` : `Sent ${r.sent} follow-up(s).`); await load(); }
  catch (e) { alert(e.message); }
};
load().catch((e) => { $("right").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
setInterval(() => { if (document.activeElement?.id !== "reply") load().catch(() => {}); }, 20000);
</script>
</body>
</html>
